services:
  db:
    image: postgres:18-alpine
    container_name: scrabble-calculator-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: scrabble_user
      POSTGRES_PASSWORD: scrabble_password
      POSTGRES_DB: scrabble_calculator

    ports:
      - "5440:5432"

    volumes:
      - scrabble_calculator_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U scrabble_user -d scrabble_calculator"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  scrabble_calculator_postgres_data:
