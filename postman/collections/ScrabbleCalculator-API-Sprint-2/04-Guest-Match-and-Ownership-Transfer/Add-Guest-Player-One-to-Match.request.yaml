name: Add Guest Player One to Match
request:
  method: POST
  url: '{{baseUrl}}/api/{{apiVersion}}/matches/{{guestMatchId}}/players'
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: x-guest-session-token
      value: '{{guestSessionToken}}'
  body:
    mode: raw
    raw: |-
      {
        "source": "GUEST_PLAYER",
        "guestPlayerId": "{{guestPlayerOneId}}"
      }
    options:
      raw:
        language: json
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test('Status is 201', function () {
          pm.response.to.have.status(201);
        });
