name: Create Guest Session
request:
  method: POST
  url: '{{baseUrl}}/api/{{apiVersion}}/guest/sessions'
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
  body:
    mode: raw
    raw: |-
      {}
    options:
      raw:
        language: json
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test('Status is 201', function () {
          pm.response.to.have.status(201);
        });
        const body = pm.response.json();
        pm.environment.set(
          'guestSessionToken',
          body.data.guestSessionToken
        );
        pm.environment.set(
          'guestSessionId',
          body.data.guestSession.id
        );
