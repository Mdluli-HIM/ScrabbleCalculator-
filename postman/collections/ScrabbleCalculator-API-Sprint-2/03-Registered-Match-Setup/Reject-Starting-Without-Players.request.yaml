name: Reject Starting Without Players
request:
  method: POST
  url: '{{baseUrl}}/api/{{apiVersion}}/matches/{{registeredMatchId}}/start'
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{accessToken}}'
  body:
    mode: raw
    raw: |-
      {}
    options:
      raw:
        language: json
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test('Status is 409', function () {
          pm.response.to.have.status(409);
        });
        const body = pm.response.json();
        pm.test('Minimum players are required', function () {
          pm.expect(body.error.code)
            .to.eql('MATCH_REQUIRES_MORE_PLAYERS');
        });
