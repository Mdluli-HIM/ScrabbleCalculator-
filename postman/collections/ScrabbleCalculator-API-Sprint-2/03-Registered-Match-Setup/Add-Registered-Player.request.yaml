name: Add Registered Player
request:
  method: POST
  url: '{{baseUrl}}/api/{{apiVersion}}/matches/{{registeredMatchId}}/players'
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{accessToken}}'
  body:
    mode: raw
    raw: |-
      {
        "source": "REGISTERED_USER"
      }
    options:
      raw:
        language: json
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test('Status is 201', function () {
          pm.response.to.have.status(201);
        });
        const body = pm.response.json();
        const player = body.data.match.players.find(function (item) {
          return item.source === 'REGISTERED_USER';
        });
        pm.environment.set('registeredPlayerId', player.id);
