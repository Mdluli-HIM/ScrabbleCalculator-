name: Reject Duplicate Local Name
request:
  method: POST
  url: '{{baseUrl}}/api/{{apiVersion}}/matches/{{registeredMatchId}}/players'
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{accessToken}}'
  body:
    mode: raw
    raw: |-
      {
        "source": "LOCAL",
        "displayName": "  LERATO  "
      }
    options:
      raw:
        language: json
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test('Status is 409', function () {
          pm.response.to.have.status(409);
        });
        const body = pm.response.json();
        pm.test('Normalized duplicate is rejected', function () {
          pm.expect(body.error.code)
            .to.eql('MATCH_PLAYER_NAME_ALREADY_EXISTS');
        });
