name: ScrabbleCalculator - Local

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
values:
  - key: baseUrl
    value: 'http://localhost:5050'
    enabled: true

  - key: apiVersion
    value: v1
    enabled: true

# ---------------------------------------------------------------------------
# Registered user credentials  (fill before first run)
# ---------------------------------------------------------------------------
  - key: email
    value: ''          # e.g. marcus@example.com
    enabled: true

  - key: displayName
    value: 'Marcus Sprint Two'
    enabled: true

  - key: password
    value: 'SecurePassword123!'
    type: secret
    enabled: true

# ---------------------------------------------------------------------------
# Auth tokens  (auto-populated by collection scripts)
# ---------------------------------------------------------------------------
  - key: accessToken
    value: ''
    type: secret
    enabled: true

  - key: refreshToken
    value: ''
    type: secret
    enabled: true

# ---------------------------------------------------------------------------
# Registered-flow IDs  (auto-populated by collection scripts)
# ---------------------------------------------------------------------------
  - key: registeredUserId
    value: ''
    enabled: true

  - key: registeredMatchId
    value: ''
    enabled: true

  - key: registeredPlayerId
    value: ''
    enabled: true

  - key: localPlayerId
    value: ''
    enabled: true

# ---------------------------------------------------------------------------
# Guest-flow IDs  (auto-populated by collection scripts)
# ---------------------------------------------------------------------------
  - key: guestSessionId
    value: ''
    enabled: true

  - key: guestSessionToken
    value: ''
    type: secret
    enabled: true

  - key: guestPlayerOneId
    value: ''
    enabled: true

  - key: guestPlayerTwoId
    value: ''
    enabled: true

  - key: guestMatchId
    value: ''
    enabled: true
